name: CI Gates

on:
  push:
    branches: [main, develop, div_dev]
  pull_request:
    branches: [main, develop, div_dev]
  workflow_dispatch:

jobs:
  test:
    name: Unit & Integration Tests (Race Detector & Coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: pg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Go Dependencies
        run: go mod verify

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/pg_test?sslmode=disable
          JWT_SECRET: ci_test_jwt_secret_must_be_32_characters_long!!
          OTP_HMAC_SECRET: ci_test_otp_hmac_secret_32_chars_long!!
          MAGIC_LINK_HMAC_SECRET: ci_test_magic_link_secret_32_chars!
        run: go run ./cmd/migrate

      - name: Run Tests with Race Detector, Skip Audit & Coverage Gate
        env:
          REQUIRE_DB: "1"
          DATABASE_URL: postgres://postgres:password@localhost:5432/pg_test?sslmode=disable
          JWT_SECRET: ci_test_jwt_secret_must_be_32_characters_long!!
          OTP_HMAC_SECRET: ci_test_otp_hmac_secret_32_chars_long!!
          MAGIC_LINK_HMAC_SECRET: ci_test_magic_link_secret_32_chars!
          KYC_IDENTITY_SECRET: ci_test_kyc_identity_secret_32_chars!
          PAYOUT_CHECKSUM_SECRET: ci_test_payout_checksum_secret_32_chars!
        run: |
          set -o pipefail
          go test -race -v -coverprofile=coverage.out ./... -timeout 10m | tee test_output.log
          go run ./scripts/audit_skips.go test_output.log
          go run ./scripts/check-coverage.go -profile=coverage.out

      - name: Run Go Vet
        run: go vet ./...

  security:
    name: Security & Vulnerability Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: No raw err.Error() in HTTP responses (ADR-2 H2)
        run: |
          if grep -rn 'gin\.H{"error": err\.Error()}' internal/api; then
            echo "FAIL: raw err.Error() in HTTP response found — use respondErr() instead"
            exit 1
          fi
          echo "PASS: No raw err.Error() responses in internal/api"

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gosec Security Scanner
        uses: securego/gosec@v2.22.1
        with:
          args: '-conf .gosec.json ./...'

      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
