name: Deploy pg-app

on:
  # Restore 'push: branches: [main]' once the pg-app-server self-hosted runner is provisioned and registered.
  workflow_dispatch:
    inputs:
      react_ref:
        description: 'Explicit commit SHA or git ref for pg-react paired release'
        required: true
        default: 'main'

jobs:
  build-and-verify:
    name: Build Frontend & Verify Release Binary
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: pg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout pg-go
        uses: actions/checkout@v4
        with:
          path: pg-go
          fetch-depth: 0

      - name: Checkout pg-react
        uses: actions/checkout@v4
        with:
          repository: pg-cashflow/pg-react
          path: pg-react
          ref: ${{ inputs.react_ref || 'main' }}
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pg-react/package-lock.json

      - name: Verify and Build Frontend
        working-directory: pg-react
        env:
          VITE_API_BASE_URL: /api
          PG_GO_ERROR_CODES: ${{ github.workspace }}/pg-go/internal/apierr/error-codes.json
        run: |
          npm ci
          npm run lint
          npm run check:error-codes
          npm run test
          npm run build

      - name: Bundle Frontend into Backend Workspace
        run: |
          rm -rf pg-go/internal/web/dist/*
          cp -r pg-react/dist/* pg-go/internal/web/dist/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'pg-go/go.mod'
          cache: true
          cache-dependency-path: pg-go/go.sum

      - name: Verify Go Dependencies
        working-directory: pg-go
        run: go mod verify

      - name: Run Migrations on Test DB
        working-directory: pg-go
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/pg_test?sslmode=disable
          JWT_SECRET: ci_test_jwt_secret_must_be_32_characters_long!!
          OTP_HMAC_SECRET: ci_test_otp_hmac_secret_32_chars_long!!
          MAGIC_LINK_HMAC_SECRET: ci_test_magic_link_secret_32_chars!
        run: go run ./cmd/migrate

      - name: Run Full Test Suite with Race Detector & Coverage
        working-directory: pg-go
        env:
          REQUIRE_DB: "1"
          DATABASE_URL: postgres://postgres:password@localhost:5432/pg_test?sslmode=disable
          JWT_SECRET: ci_test_jwt_secret_must_be_32_characters_long!!
          OTP_HMAC_SECRET: ci_test_otp_hmac_secret_32_chars_long!!
          MAGIC_LINK_HMAC_SECRET: ci_test_magic_link_secret_32_chars!
          KYC_IDENTITY_SECRET: ci_test_kyc_identity_secret_32_chars!
          PAYOUT_CHECKSUM_SECRET: ci_test_payout_checksum_secret_32_chars!
        run: |
          set -o pipefail
          go test -race -v -coverprofile=coverage.out ./... -timeout 10m | tee test_output.log
          go run ./scripts/audit_skips.go test_output.log
          go run ./scripts/check-coverage.go -profile=coverage.out -require-all

      - name: Run Ledger Controls Integrity Suite (ADR-015 / ADR-016)
        working-directory: pg-go
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/pg_test?sslmode=disable
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/sql/ledger_controls_test.sql

      - name: Run Trigger Coverage Suite
        working-directory: pg-go
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/pg_test?sslmode=disable
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/sql/ledger_trigger_coverage_test.sql

      - name: Run Fuzz Smoke Suite
        working-directory: pg-go
        run: |
          go test -fuzz=FuzzNormalizeUTR -fuzztime=30s ./internal/domain
          go test -fuzz=FuzzParseBankCSV -fuzztime=30s ./internal/csv
          go test -fuzz=FuzzNormalizePhone -fuzztime=30s ./internal/auth
          go test -fuzz=FuzzParseWebhook -fuzztime=30s ./internal/cashfree
          go test -fuzz=FuzzDecodeAadhaarQR -fuzztime=30s ./internal/aadhaar

      - name: Vet Backend Code
        working-directory: pg-go
        run: go vet ./...

      - name: No raw err.Error() in HTTP responses (ADR-2 H2)
        working-directory: pg-go
        run: |
          if grep -rn 'gin\.H{"error": err\.Error()}' internal/api; then
            echo "FAIL: raw err.Error() in HTTP response found — use respondErr() instead"
            exit 1
          fi
          echo "PASS: No raw err.Error() responses in internal/api"

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gosec Security Scanner
        uses: securego/gosec@v2.22.1
        with:
          args: '-conf pg-go/.gosec.json ./pg-go/...'

      - name: Govulncheck
        working-directory: pg-go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck -json ./... > govulncheck-report.json || true
          govulncheck ./...

      - name: Build Immutable Production Binary
        working-directory: pg-go
        env:
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w" -o server ./cmd/server
          sha256sum server > server.sha256
          echo "Artifact SHA-256:"
          cat server.sha256

      - name: Generate Release Provenance Manifest
        working-directory: pg-go
        run: |
          GO_SHA=$(git rev-parse HEAD)
          REACT_SHA=$(cd ../pg-react && git rev-parse HEAD)
          BINARY_SHA=$(awk '{print $1}' server.sha256)
          cat <<EOF > release-manifest.json
          {
            "release_time": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "go_sha": "$GO_SHA",
            "react_ref": "${{ inputs.react_ref || 'main' }}",
            "react_sha": "$REACT_SHA",
            "binary_sha256": "$BINARY_SHA"
          }
          EOF
          echo "Release Manifest:"
          cat release-manifest.json

      - name: Archive Verified Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pg-app-release
          path: |
            pg-go/server
            pg-go/server.sha256
            pg-go/release-manifest.json
          retention-days: 14

  migrate:
    name: Apply Expand-Only Database Migrations
    needs: build-and-verify
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pg-go
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Migrations
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: go run ./cmd/migrate

  deploy:
    name: Atomic Deploy Verified Binary
    needs: [build-and-verify, migrate]
    environment: production
    runs-on: [self-hosted, pg-app-server]
    steps:
      - name: Download Verified Release Artifact
        uses: actions/download-artifact@v4
        with:
          name: pg-app-release

      - name: Verify Artifact Checksum
        run: |
          sha256sum -c server.sha256

      - name: Atomic Deploy with Rollback & Health Check
        run: |
          set -euo pipefail
          test -f /opt/pg-app/server && cp /opt/pg-app/server /opt/pg-app/server.bak || true
          cp server /opt/pg-app/server.new
          chmod +x /opt/pg-app/server.new
          mv /opt/pg-app/server.new /opt/pg-app/server

          # Restart service and verify systemd active status
          if sudo /usr/bin/systemctl restart pg-app && sleep 2 && /usr/bin/systemctl is-active --quiet pg-app; then
            echo "Service restarted. Checking /healthz endpoint..."
            HEALTH_URL="http://127.0.0.1:8080/healthz"
            HEALTH_OK=false
            for i in $(seq 1 10); do
              if curl -fsS "$HEALTH_URL" > /dev/null; then
                HEALTH_OK=true
                break
              fi
              echo "Healthcheck attempt $i failed, retrying in 2s..."
              sleep 2
            done

            if [ "$HEALTH_OK" = true ]; then
              echo "Deployment successful: pg-app is healthy."
              exit 0
            fi
            echo "Healthcheck failed! Triggering rollback..."
          else
            echo "Service start failed! Triggering rollback..."
          fi

          # Rollback section
          if test -f /opt/pg-app/server.bak; then
            mv /opt/pg-app/server.bak /opt/pg-app/server || true
            sudo /usr/bin/systemctl restart pg-app && sleep 2 || true
            if /usr/bin/systemctl is-active --quiet pg-app; then
              echo "Rollback successful: previous version restored and active."
            else
              echo "CRITICAL: Rollback failed! Service is inactive."
              /usr/bin/systemctl status pg-app --no-pager || true
            fi
          else
            echo "No backup binary found (first deployment?). Leaving in failed state."
            /usr/bin/systemctl status pg-app --no-pager || true
          fi
          exit 1
