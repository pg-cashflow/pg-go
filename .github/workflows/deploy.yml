name: Deploy pg-app

on:
  # Restore 'push: branches: [main]' once the pg-app-server self-hosted runner is provisioned and registered.
  workflow_dispatch:

jobs:
  verify:
    name: Verify Pre-Deployment Gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: pg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Migrations on Test DB
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/pg_test?sslmode=disable
          JWT_SECRET: ci_test_jwt_secret_must_be_32_characters_long!!
          OTP_HMAC_SECRET: ci_test_otp_hmac_secret_32_chars_long!!
          MAGIC_LINK_HMAC_SECRET: ci_test_magic_link_secret_32_chars!
        run: go run ./cmd/migrate

      - name: Run Tests with Live DB & Coverage Gate
        env:
          REQUIRE_DB: "1"
          DATABASE_URL: postgres://postgres:password@localhost:5432/pg_test?sslmode=disable
          JWT_SECRET: ci_test_jwt_secret_must_be_32_characters_long!!
          OTP_HMAC_SECRET: ci_test_otp_hmac_secret_32_chars_long!!
          MAGIC_LINK_HMAC_SECRET: ci_test_magic_link_secret_32_chars!
          KYC_IDENTITY_SECRET: ci_test_kyc_identity_secret_32_chars!
          PAYOUT_CHECKSUM_SECRET: ci_test_payout_checksum_secret_32_chars!
        run: |
          set -o pipefail
          go test -race -v -coverprofile=coverage.out ./... -timeout 10m | tee test_output.log
          go run ./scripts/audit_skips.go test_output.log
          go run ./scripts/check-coverage.go -profile=coverage.out -require-all

      - name: Vet Code
        run: go vet ./...

  migrate:
    name: Apply Expand-Only Database Migrations
    needs: verify
    environment: production
    runs-on: [self-hosted, pg-app-server]
    steps:
      - name: Checkout pg-go
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Migrations
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: go run ./cmd/migrate

  deploy:
    name: Build & Atomic Deploy with Healthcheck
    needs: [verify, migrate]
    environment: production
    runs-on: [self-hosted, pg-app-server]
    steps:
      - name: Checkout pg-go
        uses: actions/checkout@v4
        with:
          path: pg-go

      - name: Checkout pg-react
        uses: actions/checkout@v4
        with:
          repository: pg-cashflow/pg-react
          path: pg-react
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pg-react/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: pg-go/go.mod

      - name: Build pg-react PWA
        working-directory: pg-react
        env:
          VITE_API_BASE_URL: /api
        run: |
          npm ci
          npm run build

      - name: Copy frontend build into pg-go
        run: |
          rm -rf pg-go/internal/web/dist/*
          cp -r pg-react/dist/* pg-go/internal/web/dist/

      - name: Build binary
        working-directory: pg-go
        env:
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o server ./cmd/server

      - name: Atomic deploy with rollback & health check
        working-directory: pg-go
        run: |
          set -euo pipefail
          test -f /opt/pg-app/server && cp /opt/pg-app/server /opt/pg-app/server.bak || true
          cp server /opt/pg-app/server.new
          chmod +x /opt/pg-app/server.new
          mv /opt/pg-app/server.new /opt/pg-app/server

          # Restart service and verify systemd active status
          if sudo /usr/bin/systemctl restart pg-app && sleep 2 && /usr/bin/systemctl is-active --quiet pg-app; then
            echo "Service restarted. Checking /healthz endpoint..."
            HEALTH_URL="http://127.0.0.1:8080/healthz"
            HEALTH_OK=false
            for i in $(seq 1 10); do
              if curl -fsS "$HEALTH_URL" > /dev/null; then
                HEALTH_OK=true
                break
              fi
              echo "Healthcheck attempt $i failed, retrying in 2s..."
              sleep 2
            done

            if [ "$HEALTH_OK" = true ]; then
              echo "Deployment successful: pg-app is healthy."
              exit 0
            fi
            echo "Healthcheck failed! Triggering rollback..."
          else
            echo "Service start failed! Triggering rollback..."
          fi

          # Rollback section
          if test -f /opt/pg-app/server.bak; then
            mv /opt/pg-app/server.bak /opt/pg-app/server || true
            sudo /usr/bin/systemctl restart pg-app && sleep 2 || true
            if /usr/bin/systemctl is-active --quiet pg-app; then
              echo "Rollback successful: previous version restored and active."
            else
              echo "CRITICAL: Rollback failed! Service is inactive."
              /usr/bin/systemctl status pg-app --no-pager || true
            fi
          else
            echo "No backup binary found (first deployment?). Leaving in failed state."
            /usr/bin/systemctl status pg-app --no-pager || true
          fi
          exit 1
