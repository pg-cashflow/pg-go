# Jan 1 08:00 IST = 02:30 UTC
name: Yearly financial summary

on:
  # Schedule disabled until production server and database are provisioned
  # schedule:
  #   - cron: "30 2 1 1 *"
  workflow_dispatch:

jobs:
  summary-yearly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download modules
        run: go mod download

      - name: Run financial-summary (yearly)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: go run ./cmd/financial-summary/ --cadence=yearly
