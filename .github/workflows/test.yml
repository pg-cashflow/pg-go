name: Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: pg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout pg-go
        uses: actions/checkout@v4
        with:
          path: pg-go

      - name: Checkout pg-react
        if: ${{ secrets.GH_PAT != '' }}
        uses: actions/checkout@v4
        with:
          repository: pg-cashflow/pg-react
          path: pg-react
          token: ${{ secrets.GH_PAT }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: pg-go/go.mod

      - uses: actions/setup-node@v4
        if: ${{ secrets.GH_PAT != '' }}
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pg-react/package-lock.json

      - name: Test and build pg-react
        if: ${{ secrets.GH_PAT != '' }}
        working-directory: pg-react
        env:
          VITE_API_BASE_URL: /api
        run: |
          npm ci
          npm run lint
          npm run check:error-codes
          npm run test
          npm run build

      - name: Download Go modules
        working-directory: pg-go
        run: go mod download

      - name: Apply database migrations
        working-directory: pg-go
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/pg_test?sslmode=disable
          JWT_SECRET: ci_test_jwt_secret_must_be_32_characters_long!!
          OTP_HMAC_SECRET: ci_test_otp_hmac_secret_32_chars_long!!
          MAGIC_LINK_HMAC_SECRET: ci_test_magic_link_secret_32_chars!
        run: go run ./cmd/migrate

      - name: Test pg-go
        working-directory: pg-go
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/pg_test?sslmode=disable
          JWT_SECRET: ci_test_jwt_secret_must_be_32_characters_long!!
          OTP_HMAC_SECRET: ci_test_otp_hmac_secret_32_chars_long!!
          MAGIC_LINK_HMAC_SECRET: ci_test_magic_link_secret_32_chars!
          KYC_IDENTITY_SECRET: ci_test_kyc_identity_secret_32_chars!
        run: go test -v ./... -timeout 5m

      - name: Vet pg-go
        working-directory: pg-go
        run: go vet ./...
