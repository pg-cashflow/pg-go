# Daily 02:00 IST = 20:30 UTC previous day
name: Database backup to R2

on:
  # Schedule disabled until production server and database are provisioned
  # schedule:
  #   - cron: "30 20 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pg_dump and rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client rclone gzip

      - name: Dump, gzip, upload to R2
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_TYPE: ${{ secrets.RCLONE_CONFIG_R2_TYPE }}
        run: bash scripts/backup-r2.sh
