name: Nightly Crash and Recovery (G7)

on:
  schedule:
    - cron: '0 2 * * *' # Run nightly at 02:00 UTC
  workflow_dispatch:

jobs:
  crash-recovery:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: pg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download Go modules
        run: go mod download

      - name: Apply database migrations
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/pg_test?sslmode=disable
          DATABASE_MAINT_URL: postgres://postgres:password@localhost:5432/pg_test?sslmode=disable
          JWT_SECRET: ci_test_jwt_secret_must_be_32_characters_long!!
          OTP_HMAC_SECRET: ci_test_otp_hmac_secret_32_chars_long!!
          MAGIC_LINK_HMAC_SECRET: ci_test_magic_link_secret_32_chars!
        run: go run ./cmd/migrate

      - name: Run Crash and Recovery Test Suite (G7)
        env:
          REQUIRE_DB: "1"
          DATABASE_URL: postgres://postgres:password@localhost:5432/pg_test?sslmode=disable
          DATABASE_MAINT_URL: postgres://postgres:password@localhost:5432/pg_test?sslmode=disable
          JWT_SECRET: ci_test_jwt_secret_must_be_32_characters_long!!
          OTP_HMAC_SECRET: ci_test_otp_hmac_secret_32_chars_long!!
          MAGIC_LINK_HMAC_SECRET: ci_test_magic_link_secret_32_chars!
          KYC_IDENTITY_SECRET: ci_test_kyc_identity_secret_32_chars!
        run: |
          go test -race -v -run "TestGate07_CrashRecovery" ./internal/jobs
          go test -race -v -run "TestPhysicalCrashSafety" ./internal/finance
